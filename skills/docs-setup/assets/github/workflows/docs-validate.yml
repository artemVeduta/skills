# Managed OKF validation workflow. Install to .github/workflows/docs-validate.yml.
# Runs the repository's strict docs validation over the COMPLETE bundle on both
# pushes and pull requests. The validator has no dependencies, so `npm run` works
# regardless of the repo's package manager (no install step needed). Exit
# contract: 0 clean/warnings-only, 1 hard bundle errors (fails the job),
# 2 validator malfunction (fails the job).
name: docs-validate

on:
  push:
  pull_request:

jobs:
  docs-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Docs validator (strict — exit 1 fails the job)
        run: npm run docs:validate
