name: CI

on:
  push:
  pull_request:

jobs:
  static-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Skill linter (strict — gates on ERRORs)
        run: npm run lint:skills:strict
      - name: Docs validator (strict — exit 1 on hard errors fails the job, 2 on malfunction)
        run: npm run docs:validate
      - name: Installer + repo tests (deterministic)
        run: npm test
